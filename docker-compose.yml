version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: atollhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-atollhub_multishop}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds/001_demo_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atollhub_backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres_dev_pass@postgres:5432/atollhub_multishop
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atollhub_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
